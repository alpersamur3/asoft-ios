name: qemu-win

# qemu-system-aarch64 for Windows (MSYS2 UCRT64), built twice from the same QEMU tag:
# "stock" and "patched" (qemu/patches/*.patch), so the patches can be measured against a
# build that differs in nothing else. Each artifact is a folder with the exe and its DLLs;
# run it with QEMU_SYSTEM_AARCH64=<folder>\qemu-system-aarch64.exe tools/qemu-sweet.py ...
on:
  # Dispatch needs the file on the default branch; a push to qemu-virt runs it from there.
  push:
    branches: [qemu-virt]
    paths:
      - "qemu/patches/**"
      - ".github/workflows/qemu-win.yml"
  workflow_dispatch:
    inputs:
      qemu_ref:
        description: QEMU tag or branch to build
        default: v11.1.2

env:
  QEMU_REF: ${{ inputs.qemu_ref || 'v11.1.2' }}

concurrency:
  group: qemu-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, patched]
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qemu

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison diffutils flex git grep make sed
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-certifi
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-capstone
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-SDL2

      - name: Fetch QEMU
        run: |
          git clone -q --depth 1 -b "$QEMU_REF" https://github.com/qemu/qemu.git qemu-src
          git -C qemu-src log --oneline -1

      - name: Apply patches
        if: matrix.variant == 'patched'
        run: |
          for p in qemu/patches/*.patch; do
            echo "== $p"
            # checkout on Windows may have given the patch CRLF line ends; QEMU's sources are LF
            sed 's/\r$//' "$p" | git -C qemu-src apply --verbose -
          done

      - name: Configure
        run: |
          mkdir build && cd build
          # our build says so in `qemu-system-aarch64 --version`: "11.1.2 (ASoftware)"
          pkgversion=; [ "${{ matrix.variant }}" = patched ] && pkgversion=--with-pkgversion=ASoftware
          ../qemu-src/configure --target-list=aarch64-softmmu -Ddebug=false \
            --disable-docs --disable-tools --disable-guest-agent \
            --enable-gtk --enable-opengl --enable-sdl --enable-slirp --enable-fdt=internal $pkgversion

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Package
        run: |
          mkdir dist
          cp build/qemu-system-aarch64.exe build/qemu-system-aarch64w.exe dist/
          # ANGLE (libEGL/libGLESv2): libepoxy loads it at run time for gl=on, so no import
          # table names it; without it gl=on crashes.
          todo="dist/qemu-system-aarch64.exe"
          for dll in $(pacman -Ql mingw-w64-ucrt-x86_64-angleproject | awk '/\/bin\/.*\.dll$/ {print $2}'); do
            cp "$dll" dist/
            todo="$todo dist/$(basename "$dll")"
          done
          # The DLLs from /ucrt64/bin these need, recursively (as scripts/nsis.py does).
          while [ -n "$todo" ]; do
            next=""
            for f in $todo; do
              for dll in $(objdump -p "$f" | sed -n 's/^\s*DLL Name: //p'); do
                if [ -f "/ucrt64/bin/$dll" ] && [ ! -f "dist/$dll" ]; then
                  cp "/ucrt64/bin/$dll" dist/
                  next="$next dist/$dll"
                fi
              done
            done
            todo="$next"
          done
          # GTK runtime data: settings schemas and the image loaders for the window icon.
          mkdir -p dist/share/glib-2.0/schemas dist/lib
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled dist/share/glib-2.0/schemas/
          cp -r /ucrt64/lib/gdk-pixbuf-2.0 dist/lib/
          cp qemu-src/COPYING qemu-src/LICENSE dist/
          [ "${{ matrix.variant }}" = patched ] && cp qemu/patches/*.patch dist/
          echo "QEMU $QEMU_REF ($(git -C qemu-src rev-parse HEAD)), ${{ matrix.variant }}" > dist/BUILD.txt
          (cd dist && sha256sum qemu-system-aarch64.exe > SHA256SUMS)
          ls dist | wc -l
          du -sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-win-${{ matrix.variant }}
          path: dist
