name: qemu-win

# qemu-system-aarch64 for Windows (MSYS2 MINGW64), built twice from the same QEMU tag:
# "stock" and "patched" (qemu/patches/*.patch), so the patches can be measured against a
# build that differs in nothing else. Each artifact is a folder with the exe and its DLLs;
# run it with QEMU_SYSTEM_AARCH64=<folder>\qemu-system-aarch64.exe tools/qemu-sweet.py ...
on:
  workflow_dispatch:
    inputs:
      qemu_ref:
        description: QEMU tag or branch to build
        default: v11.1.2

concurrency:
  group: qemu-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, patched]
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qemu

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            bison diffutils flex git grep make sed
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-certifi
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-python-wheel
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-dtc
            mingw-w64-x86_64-capstone
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-SDL2

      - name: Fetch QEMU
        run: |
          git clone -q --depth 1 -b "${{ inputs.qemu_ref }}" https://github.com/qemu/qemu.git qemu-src
          git -C qemu-src log --oneline -1

      - name: Apply patches
        if: matrix.variant == 'patched'
        run: |
          for p in qemu/patches/*.patch; do
            echo "== $p"
            git -C qemu-src apply --verbose "$PWD/$p"
          done

      - name: Configure
        run: |
          mkdir build && cd build
          ../qemu-src/configure --target-list=aarch64-softmmu -Ddebug=false \
            --disable-docs --disable-tools --disable-guest-agent \
            --enable-gtk --enable-opengl --enable-sdl --enable-slirp --enable-fdt=system

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Package
        run: |
          mkdir dist
          cp build/qemu-system-aarch64.exe build/qemu-system-aarch64w.exe dist/
          # The DLLs from /mingw64/bin the exe needs, recursively (as scripts/nsis.py does).
          todo="dist/qemu-system-aarch64.exe"
          while [ -n "$todo" ]; do
            next=""
            for f in $todo; do
              for dll in $(objdump -p "$f" | sed -n 's/^\s*DLL Name: //p'); do
                if [ -f "/mingw64/bin/$dll" ] && [ ! -f "dist/$dll" ]; then
                  cp "/mingw64/bin/$dll" dist/
                  next="$next dist/$dll"
                fi
              done
            done
            todo="$next"
          done
          # GTK runtime data: settings schemas and the image loaders for the window icon.
          mkdir -p dist/share/glib-2.0/schemas dist/lib
          cp /mingw64/share/glib-2.0/schemas/gschemas.compiled dist/share/glib-2.0/schemas/
          cp -r /mingw64/lib/gdk-pixbuf-2.0 dist/lib/
          cp qemu-src/COPYING qemu-src/LICENSE dist/
          [ "${{ matrix.variant }}" = patched ] && cp qemu/patches/*.patch dist/
          echo "QEMU ${{ inputs.qemu_ref }} ($(git -C qemu-src rev-parse HEAD)), ${{ matrix.variant }}" > dist/BUILD.txt
          (cd dist && sha256sum qemu-system-aarch64.exe > SHA256SUMS)
          ls dist | wc -l
          du -sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-win-${{ matrix.variant }}
          path: dist
